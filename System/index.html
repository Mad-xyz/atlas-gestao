    <!-- Google Fonts: stylesheet direto (CSP-compatible, sem inline onload) -->

    <!-- CSS crítico inline: garante que skeletons animem antes do bundle principal carregar -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; background: #000; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
